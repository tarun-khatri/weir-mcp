identity:
  author: "tarun-khatri"
  name: "weir"
  label:
    en_US: "Weir"
    zh_Hans: "Weir"
    ja_JP: "Weir"
  description:
    en_US: "Public X (Twitter) and Reddit data: search posts, read replies, threads, timelines and Reddit comments. No X or Reddit account or API key needed; paid per result, 5,000 free credits a month."
    zh_Hans: "公开的推特（X）和 Reddit 数据：搜索推文，读取回复、推文串、时间线和 Reddit 评论。无需 X 或 Reddit 账号和 API Key；按结果计费，每月 5,000 免费积分。"
    ja_JP: "公開されている X（旧 Twitter）と Reddit のデータ。ポストの検索、返信・スレッド・タイムライン、Reddit のコメントを取得します。X や Reddit のアカウントや API キーは不要で、結果ごとの課金、毎月 5,000 クレジットが無料です。"
