    label:
      en_US: "Weir API key"
      zh_Hans: "Weir API Key"
      ja_JP: "Weir API キー"
    placeholder:
      en_US: "Paste your Weir API key"
      zh_Hans: "粘贴你的 Weir API Key"
      ja_JP: "Weir の API キーを貼り付け"
    help:
      en_US: "Create a key at weirapp.io (Dashboard, Keys). Every account gets 5,000 free credits a month."
      zh_Hans: "在 weirapp.io 控制台的 Keys 页面创建 Key。每个账号每月有 5,000 免费积分。"
      ja_JP: "weirapp.io のダッシュボードの Keys でキーを作成します。どのアカウントも毎月 5,000 クレジットが無料です。"
    url: "https://weirapp.io/dashboard/keys"
